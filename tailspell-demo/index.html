<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2B1B5A">
<title>Tailspell: Word Chain</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="fx"></canvas>

<div id="app">
  <!-- MENU -->
  <section id="menu" class="screen active">
    <header class="bar">
      <button class="pill" id="langBtn" aria-label="Language"><svg class="ico"><use href="#i-globe"/></svg><span id="langCode">EN</span></button>
      <div class="pill coins"><svg class="ico coin"><use href="#i-coin"/></svg><span class="coinCount">0</span></div>
      <button class="round" id="soundBtn" aria-label="Sound"><svg class="ico"><use href="#i-sound"/></svg></button>
    </header>
    <h1 class="title"><span id="title1">WORD</span><span id="title2">CHAIN</span></h1>
    <div class="mascotBox menuMascot"><canvas class="mascot" data-mascot="menu"></canvas></div>
    <div class="stats glass">
      <div><b id="statBest">0</b><small data-t="best">Best</small></div>
      <div><b id="statStreak" class="hot">0</b><small data-t="streak">Streak</small></div>
      <div><b id="statWords" class="gold">0</b><small data-t="words">Words</small></div>
    </div>
    <p class="howto" data-t="howTo"></p>
    <button class="primary" id="playBtn"><svg class="ico"><use href="#i-play"/></svg><span data-t="play">PLAY</span></button>
    <div class="minis">
      <button class="secondary" id="challengeBtn">
        <svg class="ico big"><use href="#i-calendar"/></svg>
        <span><b data-t="challenge"></b><small data-t="challengeSub"></small></span>
      </button>
      <button class="secondary" id="wordBtn">
        <svg class="ico big"><use href="#i-grid"/></svg>
        <span><b data-t="wordGame"></b><small data-t="wordSub"></small></span>
      </button>
    </div>
    <a class="store" href="https://apps.apple.com/app/id6832078855" target="_blank" rel="noopener" data-t="getApp"></a>
  </section>

  <!-- GAME -->
  <section id="game" class="screen">
    <header class="gbar">
      <button class="round" id="homeBtn" aria-label="Menu"><svg class="ico"><use href="#i-home"/></svg></button>
      <div class="scoreBox">
        <div id="score" class="score">0</div>
        <div class="subscore">
          <span class="chip"><svg class="ico coin"><use href="#i-coin"/></svg><span class="coinCount">0</span></span>
          <span class="chip mult" id="mult">x1</span>
          <span class="chip hot" id="streakChip"><svg class="ico"><use href="#i-flame"/></svg><span id="streakNum">0</span></span>
          <span class="chip shield" id="shieldChip" hidden><svg class="ico"><use href="#i-shield"/></svg></span>
        </div>
      </div>
      <div class="hearts" id="hearts"></div>
    </header>
    <div class="modeTag" id="modeTag"></div>
    <div class="mascotBox gameMascot"><canvas class="mascot" data-mascot="game"></canvas></div>
    <div class="chain" id="chain"></div>
    <div class="toast" id="toast"></div>
    <div class="tiles" id="tiles"></div>
    <div class="helpers">
      <span class="chip lenChip" id="lenChip"></span>
      <button class="chip btn" id="lenBtn"><svg class="ico"><use href="#i-swap"/></svg><svg class="ico coin"><use href="#i-coin"/></svg>30</button>
      <button class="chip btn" id="hintBtn"><svg class="ico"><use href="#i-bulb"/></svg><svg class="ico coin"><use href="#i-coin"/></svg>20</button>
      <button class="chip btn accent" id="skipBtn" hidden><svg class="ico"><use href="#i-skip"/></svg><span data-t="skip">Skip</span><svg class="ico coin"><use href="#i-coin"/></svg>40</button>
    </div>
    <div class="keyboard" id="kb"></div>
  </section>

  <!-- SECRET WORD -->
  <section id="word" class="screen">
    <header class="gbar">
      <button class="round" id="wordHome" aria-label="Menu"><svg class="ico"><use href="#i-close"/></svg></button>
      <div class="scoreBox">
        <div class="wtitle"><svg class="ico"><use href="#i-grid"/></svg><span data-t="wordGame"></span></div>
        <div class="subscore">
          <span class="dots" id="guessDots"></span>
          <span class="chip" id="changesChip"><svg class="ico"><use href="#i-swap"/></svg><span id="changesLeft">5</span></span>
        </div>
      </div>
      <button class="round" id="wordHelpBtn" aria-label="Help"><svg class="ico"><use href="#i-help"/></svg></button>
    </header>
    <div class="target" id="target"></div>
    <div class="mascotBox wordMascot"><canvas class="mascot" data-mascot="word"></canvas></div>
    <div class="chain" id="wchain"></div>
    <div class="toast" id="wtoast"></div>
    <div class="tiles" id="wtiles"></div>
    <div class="helpers">
      <button class="chip btn" id="wLen"><svg class="ico"><use href="#i-swap"/></svg><span data-t="letterCount"></span></button>
      <button class="chip btn" id="wFirst"><svg class="ico"><use href="#i-text"/></svg><span data-t="firstLetter"></span></button>
    </div>
    <div class="keyboard" id="wkb"></div>
  </section>
</div>

<!-- overlays -->
<div class="overlay" id="langSheet" hidden>
  <div class="sheet glass">
    <h2 data-t="language">Language</h2>
    <div id="langList" class="langList"></div>
  </div>
</div>
<div class="overlay" id="endSheet" hidden>
  <div class="sheet glass end">
    <h2 id="endTitle"></h2>
    <div id="endBest" class="newbest" hidden></div>
    <div class="endStats" id="endStats"></div>
    <div id="endChain" class="endChain"></div>
    <button class="primary" id="againBtn"><svg class="ico"><use href="#i-replay"/></svg><span data-t="playAgain"></span></button>
    <button class="secondary center" id="endMenuBtn"><span data-t="menu"></span></button>
    <a class="store" href="https://apps.apple.com/app/id6832078855" target="_blank" rel="noopener" data-t="getApp"></a>
  </div>
</div>
<div class="overlay" id="helpSheet" hidden>
  <div class="sheet glass">
    <h2 data-t="wordGame"></h2>
    <p data-t="wordHelp"></p>
    <button class="primary" id="helpOk"><span>OK</span></button>
  </div>
</div>
<div class="overlay loading" id="loading" hidden><div class="spinner"></div><p data-t="loading"></p></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#FFC83D"/><circle cx="12" cy="12" r="7" fill="#FFB020"/><path d="M12 7.5v9M9.5 9.5h4a1.6 1.6 0 010 3.2h-3a1.6 1.6 0 000 3.2h4" stroke="#8A5A00" stroke-width="1.7" fill="none" stroke-linecap="round"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.3 3 4.5 6.7 4.5c2.2 0 3.6 1.2 5.3 3.1 1.7-1.9 3.1-3.1 5.3-3.1 3.7 0 5.8 3.8 4.3 7.3C19.5 16.4 12 21 12 21z"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path fill="#FF8A2B" d="M12 2c1 3.5 5.5 5.8 5.5 11a5.5 5.5 0 01-11 0c0-2.6 1.4-4 2.4-5 .1 1.6.8 2.8 1.9 3.3C10.6 8.5 11 5 12 2z"/><path fill="#FFD04A" d="M12 12c.6 1.6 2.6 2.4 2.6 4.6a2.6 2.6 0 01-5.2 0c0-1.3.8-2 1.4-2.6.2.8.6 1.2 1.2 1.4-.3-1.3-.3-2.4 0-3.4z"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path fill="#7CF5E1" d="M12 2l8 3v6c0 5-3.4 9.2-8 11-4.6-1.8-8-6-8-11V5l8-3z"/><path d="M8.5 12l2.4 2.4 4.6-4.8" stroke="#10303A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9.5l5 5M22 9.5l-5 5"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M7 4.5v15l12.5-7.5z"/></symbol>
    <symbol id="i-replay" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 108-8 8.3 8.3 0 00-6 2.6L4 9"/><path d="M4 4v5h5"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11L12 4l8.5 7"/><path d="M6 9.5V20h12V9.5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M9 9a3 3 0 115 2.3c-1.2.8-2 1.4-2 2.9"/><circle cx="12" cy="18.2" r=".6" fill="currentColor"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h14l-3-3M20 16H6l3 3"/></symbol>
    <symbol id="i-bulb" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.6 10.8c.7.6 1.1 1.4 1.1 2.2h5c0-.8.4-1.6 1.1-2.2A6 6 0 0012 3z" fill="#FFE27A" stroke="#FFE27A"/><path d="M9 18h6M10 21h4"/></symbol>
    <symbol id="i-skip" viewBox="0 0 24 24"><path fill="currentColor" d="M5 5l9 7-9 7zM15 5h3v14h-3z"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h11v14H9l-6-7z"/><path d="M12 9.5l5 5M17 9.5l-5 5"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3.5" fill="#FF8FB1" stroke="#FF8FB1"/><path d="M3.5 10h17" stroke="#fff"/><path d="M8 3v4M16 3v4" stroke="#fff"/><path d="M12 12.2l1 2 2.2.3-1.6 1.5.4 2.2-2-1-2 1 .4-2.2-1.6-1.5 2.2-.3z" fill="#fff" stroke="none"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2" fill="#7CF5E1"/><rect x="13" y="3" width="8" height="8" rx="2" fill="#FFE27A"/><rect x="3" y="13" width="8" height="8" rx="2" fill="#FFE27A"/><rect x="13" y="13" width="8" height="8" rx="2" fill="#FF8FB1"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18l4.5-12L12 18M4.6 14h5.8"/><path d="M15 12.5a2.5 2.5 0 115 0V18M20 15.2c-3.6-.5-5.4.4-5.4 1.6 0 1.6 2.6 1.8 5.4-.6"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2.5" fill="currentColor"/><path d="M8 11V8a4 4 0 018 0v3" fill="none" stroke="currentColor" stroke-width="2.4"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10M17 9v8H9"/></symbol>
  </defs>
</svg>
<script src="game.js"></script>
</body>
</html>
